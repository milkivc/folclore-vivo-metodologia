name: Finalizar release oficial MILK v1.0.0

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publicar-release-v010.yml'
      - 'RELEASE_NOTES_v1.0.0.md'
      - '.zenodo.json'
      - 'README.md'
      - 'LICENSE.md'
      - 'NOTICE.md'
      - 'docs/**'
      - 'metodologia/**'
      - 'regioes/**'
      - 'dados/**'

permissions:
  contents: write

jobs:
  finalizar-release-oficial:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout completo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Preparar notas oficiais
        run: |
          if [ ! -f RELEASE_NOTES_v1.0.0.md ]; then
            cat > RELEASE_NOTES_v1.0.0.md <<'EOF'
          # Folclore Vivo — Metodologia de Pesquisa MILK v1.0.0

          Primeira versão oficial arquivável do repositório metodológico Folclore Vivo — Metodologia de Pesquisa MILK, preparada para integração com Zenodo, citação pública, preservação documental e geração de DOI.
          EOF
          fi

      - name: Remover releases e tags anteriores não oficiais
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v0.1.0 --cleanup-tag --yes || true
          gh release delete v1.0.0 --cleanup-tag --yes || true

      - name: Criar pacote ZIP oficial
        run: |
          rm -f folclore-vivo-metodologia-v1.0.0.zip
          zip -r folclore-vivo-metodologia-v1.0.0.zip . \
            -x '.git/*' \
            -x 'folclore-vivo-metodologia-v1.0.0.zip'

      - name: Publicar release oficial
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.0 \
            folclore-vivo-metodologia-v1.0.0.zip \
            --title 'Folclore Vivo — Metodologia de Pesquisa MILK v1.0.0' \
            --notes-file RELEASE_NOTES_v1.0.0.md \
            --latest
